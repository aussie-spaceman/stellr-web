name: CI

# Every gate in this file was previously local and optional. The deploy record
# shows what that meant in practice: a production deployment made from a dirty
# working tree, and most changes reaching production without any of these
# having run. A check that only runs when someone remembers is not a check.

on:
  # Manual trigger, so the workflow can be exercised without waiting for an
  # event — and so it is reachable while it is still the only one in the repo.
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  # Only a PR's own newer push cancels its run. A push to dev or main runs to
  # the end: cancelling dev's run mid-e2e stopped a test before its cleanup, and
  # the event it left behind failed the next two runs (28 Oct 2026, TRACKER
  # 13.5). A push that arrives meanwhile waits; GitHub keeps one pending run per
  # group, so a third push replaces the waiting run, never the running one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes back to GitHub (no comments, statuses or releases), so
# the token is read-only.
permissions:
  contents: read

jobs:
  # Does this change touch anything the app can run? Handover docs, the close-out
  # tracker and promotion records cannot break e2e (no code reads docs/ or
  # .claude/), yet each one used to take a turn in the single repo-wide e2e
  # queue below. On 28 Sept four close-out PRs plus their dev pushes queued ~8
  # serial runs, and GitHub's one-pending-job rule cancelled two of them, so
  # the close-outs sat blocked on each other.
  #
  # An explicit allowlist, not `**/*.md`: markdown under app/ or content/ may be
  # rendered, so it must still be tested. Anything unrecognised — an empty diff,
  # a new branch, a manual run — counts as code. A push diffs only against the
  # previous push, so code whose dev-push run was cancelled by a later docs push
  # is not re-run here; it was already gated by e2e on its own PR, and the
  # dev → main promotion PR diffs everything.
  #
  # It also decides whether e2e is needed at all. A push to dev or main whose
  # exact tree already passed e2e and Storybook has nothing new to test: all 18
  # pushes to main from 12 Oct to 4 Nov repeated their promotion PR's tree, and
  # about 30 of 41 dev pushes repeated their PR's. Each repeat took a turn in the
  # queue, and gated nothing, because required checks apply before a merge. So
  # this only ever skips on a push. Every PR and manual run tests in full, as does
  # any push whose merged tree differs, such as two PRs merging close together.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      tree: ${{ steps.diff.outputs.tree }}
      e2e: ${{ steps.tested.outputs.e2e }}
    steps:
      # Full history so any push's `before` resolves, but no blobs: the diff
      # below compares trees only. The pack is ~1 GB of old video blobs
      # (public/videos/, moved to Vercel Blob on 21 Sept); fetching them took
      # this job from ~20 s to past its 5-minute timeout on 5 Oct, and the
      # cancelled job silently skipped e2e. Blobless, the history is ~2 MB.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        # --no-renames: a rename lists only its new path, so moving a file from
        # app/ into docs/ would read as docs-only. It also keeps the diff to
        # trees, so the blobless checkout never has to fetch a blob.
        run: |
          if [ "$EVENT" = pull_request ]; then
            # The checkout is GitHub's merge commit: parent 1 is the base.
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --no-renames "$BEFORE" HEAD)
          else
            files=""
          fi
          echo "Changed files:"; echo "${files:-(none resolved)}"
          code=true
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^(docs/|\.claude/)|^[^/]+\.md$'; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          if [ "$code" = false ]; then
            echo "Docs-only change: e2e skipped (the e2e gate job passes)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Fails closed: e2e is skipped only on proof that a run in this repository,
      # from this workflow file, passed both jobs on this tree. An API error, an
      # expired marker or a fork's marker all mean e2e runs. The tree includes
      # this file, so the run that wrote the marker ran this same workflow.
      - id: tested
        env:
          EVENT: ${{ github.event_name }}
          CODE: ${{ steps.diff.outputs.code }}
          TREE: ${{ steps.diff.outputs.tree }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          e2e=true
          [ "$CODE" = false ] && e2e=false
          if [ "$EVENT" = push ] && [ "$e2e" = true ]; then
            runs=$(gh api "repos/$REPO/actions/artifacts?name=e2e-passed-tree-$TREE&per_page=30" \
              --jq '.artifacts[] | select(.expired == false and .workflow_run.repository_id == .workflow_run.head_repository_id) | .workflow_run.id' \
              2>/dev/null) || runs=""
            for run in $runs; do
              path=$(gh api "repos/$REPO/actions/runs/$run" --jq .path 2>/dev/null) || continue
              [ "$path" = .github/workflows/ci.yml ] || continue
              passed=$(gh api "repos/$REPO/actions/runs/$run/jobs?per_page=30" \
                --jq '[.jobs[] | select((.name == "e2e-tests" or .name == "storybook") and .conclusion == "success")] | length' \
                2>/dev/null) || continue
              if [ "$passed" = 2 ]; then
                e2e=false
                echo "This tree already passed e2e and Storybook in run $run: https://github.com/$REPO/actions/runs/$run" | tee -a "$GITHUB_STEP_SUMMARY"
                break
              fi
            done
          fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

  # Required check. Unit tests have a job of their own so they run alongside the
  # build, and this job keeps the single name branch protection asks for. A
  # required check that is SKIPPED counts as passed, so this must always run, and
  # it passes only when both jobs did.
  verify:
    name: verify
    needs: [verify-build, unit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          BUILD: ${{ needs.verify-build.result }}
          UNIT: ${{ needs.unit.result }}
        run: |
          echo "verify-build: $BUILD; unit: $UNIT"
          if [ "$BUILD" != success ] || [ "$UNIT" != success ]; then
            echo "::error::verify needs verify-build and unit to pass (verify-build: $BUILD, unit: $UNIT)."
            exit 1
          fi

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same placeholders as verify-build, so no test sees a different environment.
    env: &verify-env
      # Placeholders. `next build` instantiates clients at module scope (see
      # lib/supabase.ts), so the build needs syntactically valid values — it
      # never connects to anything with them. Real values live in Vercel.
      # Supabase keys under the only names the app reads (the legacy
      # anon/service_role fallback was removed 3 Nov 2026,
      # docs/RUNBOOK-supabase-api-keys.md step 11). The values are deliberately
      # neither key format, so the bundle check below can grep for them.
      NEXT_PUBLIC_APP_ENV: dev
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      SUPABASE_SECRET_KEY: placeholder-secret-key
      NEXT_PUBLIC_SANITY_PROJECT_ID: placeholder
      # Public media host (non-secret; same value in every environment).
      NEXT_PUBLIC_MEDIA_BASE_URL: https://l3zabozgfpz3vahd.public.blob.vercel-storage.com
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SITE_URL: https://www.stellreducation.org
      NEXT_PUBLIC_AUTH_APP_URL: https://app.stellreducation.org
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      CLERK_SECRET_KEY: sk_test_placeholder

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm run test

  verify-build:
    name: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: *verify-env

    steps:
      # Full history, no blobs (see `changes`), so the PII lint can find the
      # merge base with origin/dev. Only the blobs it diffs are fetched.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v7
        with:
          # Matches the Vercel project's runtime (nodeVersion 24.x), which is
          # the thing this job exists to predict; .nvmrc and engines.node agree.
          # engines.node must name one major ("24.x"), not a range: Vercel
          # lets engines override Project Settings, and ">=24" moved
          # production to Node 26 on 30 Oct 2026 without CI ever running it.
          node-version: 24.x
          cache: npm

      # The repo is public. Fails on personal emails, credential numbers, Gmail
      # and Clerk IDs in lines this change ADDS to docs/, .claude/ or root *.md
      # (13 Oct 2026: an audit found 365 references to real people there). Here
      # in `verify`, not `e2e`, because docs-only PRs skip e2e. Before `npm ci`:
      # it needs only node and git, so a hit fails in seconds.
      - name: PII lint (added lines in docs)
        run: npm run lint:pii

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # S5 C5a: the legacy-authz baseline only falls. The unit test compares the
      # tree with the baseline in the same tree, so it cannot see a baseline raised
      # by regenerating it; this compares it with the merge base. A rise that is
      # meant (an idiom added to the list) takes the label, then a new push: a re-run
      # keeps the labels of the event it re-runs.
      - name: Authz ratchet (no growth since the merge base)
        run: npx tsx scripts/authz-idioms.mjs --since origin/dev
        env:
          AUTHZ_RATCHET_GROW_OK: ${{ contains(github.event.pull_request.labels.*.name, 'authz-ratchet-grow') }}

      # S5 C6: the same for the routes tenant hosts serve. The cap only falls.
      - name: Tenant-host IDOR cap (no growth since the merge base)
        run: node scripts/tenant-host-cap.mjs --since origin/dev
        env:
          TENANT_HOST_CAP_GROW_OK: ${{ contains(github.event.pull_request.labels.*.name, 'tenant-host-cap-grow') }}

      # S5 C7: the list of unaudited handlers only falls.
      - name: Audit coverage cap (no growth since the merge base)
        run: node scripts/audit-cap.mjs --since origin/dev
        env:
          AUDIT_CAP_GROW_OK: ${{ contains(github.event.pull_request.labels.*.name, 'audit-cap-grow') }}

      - name: Design-system lint
        run: npm run lint:tokens

      # Migration naming, SECURITY DEFINER revokes, and (S3) the table
      # registry: every table classified, tenant/event-scoped tables carry
      # tenant_id + index + RLS (scripts/check-migration-tenancy.mjs). Also in
      # prebuild; a step of its own so a failure is named in the summary.
      - name: Migration lints
        run: npm run lint:migrations

      # ESLint (mobile review G3): accessibility (jsx-a11y), Next and hooks
      # rules. All warnings, but --max-warnings in package.json is today's
      # count, so the number can only go down: fix some, lower it.
      - name: Lint (warnings ratchet)
        run: npm run lint:ci

      - name: Build
        run: npm run build

      # S0: the browser bundle must carry the publishable key (through
      # lib/supabase-keys.ts; chat and signed uploads read it), and must never
      # carry the server-only secret key.
      - name: Supabase keys in the browser bundle
        run: |
          grep -rqF placeholder-publishable-key .next/static \
            || { echo "::error::The public Supabase key did not reach the browser bundle."; exit 1; }
          if grep -rqF placeholder-secret-key .next/static; then
            echo "::error::The server-only Supabase key reached the browser bundle."; exit 1
          fi

  # Required check. A gate, so the name branch protection asks for stays the same
  # while the work moves into jobs that can run apart. A required check that is
  # SKIPPED counts as passed, so this must always run. It passes only for a
  # docs-only change, a tree that already passed, or both jobs succeeding. A job
  # the one-pending rule cancelled (see e2e-tests) therefore shows red here:
  # re-run the failed jobs.
  e2e:
    name: e2e
    needs: [changes, verify, e2e-tests, storybook]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - id: gate
        env:
          CODE: ${{ needs.changes.outputs.code }}
          NEEDED: ${{ needs.changes.outputs.e2e }}
          VERIFY: ${{ needs.verify.result }}
          TESTS: ${{ needs.e2e-tests.result }}
          STORYBOOK: ${{ needs.storybook.result }}
          RAN: ${{ needs.e2e-tests.outputs.ran }}
        run: |
          echo "code: $CODE; e2e needed: $NEEDED; verify: $VERIFY; e2e-tests: $TESTS; storybook: $STORYBOOK; suite ran: $RAN"
          if [ "$CODE" = false ]; then echo "Docs-only change: nothing to test."; exit 0; fi
          if [ "$NEEDED" = false ]; then echo "This tree already passed: see the changes job."; exit 0; fi
          if [ "$VERIFY" != success ]; then echo "::error::e2e did not run because verify did not pass ($VERIFY)."; exit 1; fi
          if [ "$TESTS" != success ] || [ "$STORYBOOK" != success ]; then
            echo "::error::e2e needs e2e-tests and storybook to pass (e2e-tests: $TESTS, storybook: $STORYBOOK). If one reads cancelled, re-run the failed jobs."
            exit 1
          fi
          if [ "$RAN" = true ]; then echo "record=true" >> "$GITHUB_OUTPUT"; fi

      # What the `changes` job looks for. Written last, so it exists only after
      # everything above passed, and never for a run that skipped the suite.
      - if: steps.gate.outputs.record == 'true' && needs.changes.outputs.tree != ''
        env:
          TREE: ${{ needs.changes.outputs.tree }}
        run: echo "$TREE" > e2e-passed-tree.txt

      - if: steps.gate.outputs.record == 'true' && needs.changes.outputs.tree != ''
        uses: actions/upload-artifact@v7
        with:
          name: e2e-passed-tree-${{ needs.changes.outputs.tree }}
          path: e2e-passed-tree.txt
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    needs: [verify, changes]
    # Fails closed: only an explicit false skips. If `changes` itself fails or
    # times out, its output is empty and e2e runs — on 5 Oct a timed-out `changes`
    # skipped e2e on every PR while `verify` showed green.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.changes.outputs.e2e != 'false' }}
    timeout-minutes: 20

    # One e2e job at a time across the whole repo, not per ref. Every run, from
    # any branch, writes the same seeded rows on the one dev Supabase project,
    # and the workflow-level group above only serialises runs of the SAME ref.
    # On 24 Sept a PR run and a dev run overlapped; with the credentials spec
    # resetting Grace's credential in its hooks, one run could flip it private
    # halfway through the other's publish test (TRACKER 13.1).
    #
    # cancel-in-progress: false, so another ref's run never kills this suite
    # halfway through, with rows left mutated. The workflow-level group can
    # still cancel it, but only for a newer push to the same PR. GitHub keeps
    # only ONE pending job per group: if a third run queues while one runs and
    # one waits, the waiting one is cancelled. Its e2e check then fails;
    # re-run the failed jobs.
    #
    # Everything in this job holds up every other branch, so only what needs the
    # shared rows belongs here. Storybook and Lighthouse have their own jobs.
    concurrency:
      group: e2e-dev-supabase
      cancel-in-progress: false

    outputs:
      ran: ${{ steps.config.outputs.ready }}

    env: &e2e-env
      # Non-secret configuration. The dev Supabase project, never production —
      # e2e/global-setup.ts also refuses production hosts by name, but the URL
      # is pinned here so a mis-set secret cannot silently redirect the suite.
      NEXT_PUBLIC_APP_ENV: dev
      NEXT_PUBLIC_SUPABASE_URL: https://xvxlhbxtiwxpopoqjygm.supabase.co
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_AUTH_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /account
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /account/onboarding
      NEXT_PUBLIC_MEDIA_BASE_URL: https://l3zabozgfpz3vahd.public.blob.vercel-storage.com
      # verify's build has already type-checked this code. See next.config.mjs.
      SKIP_BUILD_TYPECHECK: '1'
      ALLOW_UNCONFIGURED: ${{ vars.E2E_ALLOW_UNCONFIGURED }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      # deep review TEST-5: the e2e check is a REQUIRED gate on dev and main. It
      # used to set ready=false on a missing secret and let every later step
      # skip, so the job finished green and the required check passed WITHOUT e2e
      # having run — the exact silent-pass this workflow's own header warns
      # against. Now a missing secret FAILS the job (fail closed), so a rotated,
      # renamed or deleted secret blocks the merge instead of waving it through.
      # A repo that genuinely cannot hold secrets (a fork) opts out explicitly by
      # setting the repository variable E2E_ALLOW_UNCONFIGURED=true.
      - name: Check configuration
        id: config
        env: &e2e-secrets
          # Secrets. Configure at Settings → Secrets and variables → Actions.
          # Supabase: the publishable and secret keys only; the legacy
          # anon/service_role secrets are no longer read
          # (docs/RUNBOOK-supabase-api-keys.md, step 11). Given only to the steps
          # that use them, so `npm ci` and the setup steps never see them.
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.DEV_SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.DEV_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.DEV_CLERK_SECRET_KEY }}
          E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
          E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_EVENT_MANAGER_PASSWORD: ${{ secrets.E2E_EVENT_MANAGER_PASSWORD }}
        run: |
          missing=""
          for name in NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY \
                      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY \
                      E2E_MEMBER_PASSWORD E2E_TEACHER_PASSWORD E2E_ADMIN_PASSWORD \
                      E2E_EVENT_MANAGER_PASSWORD; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### E2E did not run"
              echo ""
              echo "Missing repository secrets:"
              for m in $missing; do echo "- \`$m\`"; done
              echo ""
              echo "Add them at **Settings → Secrets and variables → Actions**."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$ALLOW_UNCONFIGURED" != "true" ]; then
              echo "::error::e2e secrets are missing, so the suite cannot run. A required check must not pass green without running — failing closed. Set the repository variable E2E_ALLOW_UNCONFIGURED=true only for an environment (e.g. a fork) that cannot hold these secrets."
              exit 1
            fi
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.config.outputs.ready == 'true'
        run: npm ci

      # Stellr signing needs a token secret, shared by the server and the spec
      # that mints test links (e2e/core/esign-signing.spec.ts). A fresh one per
      # run: it only ever signs links to agreements this run creates on dev.
      - if: steps.config.outputs.ready == 'true'
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "ESIGN_TOKEN_SECRET=$secret" >> "$GITHUB_ENV"

      # WebKit is for the mobile-safari project (e2e/mobile), the closest CI gets
      # to an iPhone.
      - if: steps.config.outputs.ready == 'true'
        uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit

      # Built and served here rather than tested against a Vercel preview.
      # Preview builds queue behind one another on this plan, and a suite that
      # waits on someone else's queue is a suite that gets skipped.
      - if: steps.config.outputs.ready == 'true'
        env: *e2e-secrets
        run: npm run build

      - if: steps.config.outputs.ready == 'true'
        env: *e2e-secrets
        run: npx playwright test

      # This repo is public, so any signed-in GitHub user can download an
      # artifact. A Playwright report records the fixture sign-ins, including
      # the Clerk dev-browser token, and those stay usable for the session's 7
      # days. So end the sessions this run created first, and upload only for a
      # failed run: a green report helps nobody, and if the revoke failed
      # nothing goes up.
      # Flaky runs pass, so their traces are not uploaded either.
      - if: always() && steps.config.outputs.ready == 'true'
        id: revoke-sessions
        env:
          CLERK_SECRET_KEY: ${{ secrets.DEV_CLERK_SECRET_KEY }}
        run: npx tsx scripts/revoke-e2e-sessions.ts

      - if: failure() && steps.revoke-sessions.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Storybook (mobile review G5): every story renders at phone width with no
  # page error and no serious/critical axe issue (e2e/storybook). Static files
  # and a browser: no database, no secrets, so it needs neither the e2e lock nor
  # the dev keys. Still required, through the e2e gate job.
  storybook:
    name: storybook
    runs-on: ubuntu-latest
    needs: [verify, changes]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.changes.outputs.e2e != 'false' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium

      - name: Storybook stories (render + axe)
        run: |
          npm run build-storybook -- --quiet
          npx --yes http-server@14.1.1 storybook-static -p 6006 -a 127.0.0.1 -s &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:6006/index.json >/dev/null && break; sleep 1; done
          npm run test:storybook

  # Lighthouse, mobile preset, on a production build: the budgets in
  # lighthouserc.json (LCP 2.5s, TBT 200ms, CLS 0.1, script size, accessibility).
  # Report-only for now — the step can't fail the job — so the numbers settle
  # before any budget becomes a gate. Read the summary in the job log or the
  # lighthouse-report artifact. It only loads public pages, so it needs no lock
  # and nothing waits for it. The server holds the dev keys; lhci itself, fetched
  # from npm at run time, does not.
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    needs: [verify, changes]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 15
    env: *e2e-env
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - env: *e2e-secrets
        run: npm run build

      - name: Start the app
        env: *e2e-secrets
        run: |
          nohup npm start > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ >/dev/null && exit 0; sleep 1; done
          echo "::error::The app did not start."; tail -n 40 "$RUNNER_TEMP/app.log"; exit 1

      - name: Lighthouse (mobile, report-only)
        continue-on-error: true
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.json

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lhci-report/
          retention-days: 14
          if-no-files-found: ignore

  # S1: an ephemeral Postgres on the runner, built from the schema of record
  # (supabase/baseline.sql) plus every timestamped migration, then checked with
  # pgTAP (supabase/tests/database). It never touches the dev or production
  # projects, and holds no database secret. Runbook: docs/RUNBOOK-ci-database.md.
  #
  # Report-only until it has run green: a failure shows red on the PR but does
  # not fail the workflow. Once it passes, set the repository variable
  # DB_CI_ENFORCE=true, then add `db` to the required checks on dev and main.
  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ vars.DB_CI_ENFORCE != 'true' }}
    env:
      # Pinning the CLI also pins the Postgres, Auth and Storage images it pulls.
      SUPABASE_CLI_VERSION: 2.105.0
      # The local database container is named after config.toml's project_id.
      DB_CONTAINER: supabase_db_stellr-web

    steps:
      # Only supabase/ is checked out. Full history without blobs (see
      # `changes`) so the scope step can diff trees.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: supabase

      # A PR that touches neither supabase/ nor this workflow cannot change the
      # database, so the job finishes green in seconds (a required check is then
      # still satisfied). Pushes to dev/main and manual runs always build it.
      # Anything unresolved counts as in scope.
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only --no-renames HEAD^1 HEAD || true)
            if [ -n "$files" ] && ! echo "$files" | grep -qE '^supabase/|^\.github/workflows/ci\.yml$'; then
              run=false
              echo "No change under supabase/ or to ci.yml: database checks skipped." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - if: steps.scope.outputs.run == 'true'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Postgres only, not the full local stack. The CLI must NOT replay
      # supabase/migrations itself: 001–148 are historical and cannot rebuild
      # the schema (docs/SCHEMA-BASELINE.md), and the seed needs the tables.
      # These variables override config.toml's [db.migrations] / [db.seed] /
      # [realtime] for this step only.
      - if: steps.scope.outputs.run == 'true'
        name: Start the local database
        env:
          SUPABASE_DB_MIGRATIONS_ENABLED: 'false'
          SUPABASE_DB_SEED_ENABLED: 'false'
          SUPABASE_REALTIME_ENABLED: 'false'
        run: supabase db start

      # The documented rebuild (docs/SCHEMA-BASELINE.md), with ON_ERROR_STOP so
      # a partial load fails here. Three kinds of line are dropped first:
      # \restrict / \unrestrict (pg_dump 18 meta-commands), and the
      # `FOR ROLE supabase_admin` default privileges, which the postgres role
      # cannot set (on the hosted rebuild they are the one expected error, and
      # they stop the load before the postgres-role defaults that follow them).
      # psql runs inside the database container, so the client always matches
      # the server.
      - if: steps.scope.outputs.run == 'true'
        name: Load the baseline schema
        run: |
          sed -e '/^\\restrict /d' -e '/^\\unrestrict /d' \
              -e '/^ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin /d' \
              supabase/baseline.sql > "$RUNNER_TEMP/baseline.sql"
          docker exec -i -e PGPASSWORD=postgres "$DB_CONTAINER" \
            psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 \
              -c 'drop schema if exists entitlements cascade' \
              -c 'drop schema public cascade' \
              -f - < "$RUNNER_TEMP/baseline.sql"

      # Every migration since the baseline (the timestamped ones), oldest
      # first, each in its own transaction — as they were applied to production.
      - if: steps.scope.outputs.run == 'true'
        name: Apply migrations since the baseline
        run: |
          count=0
          for f in $(ls supabase/migrations | grep -E '^[0-9]{14}_.+\.sql$' | sort); do
            echo "::group::$f"
            if ! docker exec -i -e PGPASSWORD=postgres "$DB_CONTAINER" \
                 psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 \
                   --single-transaction -f - < "supabase/migrations/$f"; then
              echo "::endgroup::"
              echo "::error file=supabase/migrations/$f::This migration failed on a database built from the baseline."
              exit 1
            fi
            echo "::endgroup::"
            count=$((count + 1))
          done
          echo "Applied $count migrations on top of the baseline." | tee -a "$GITHUB_STEP_SUMMARY"

      # pgTAP. Pass the directory: the other files in supabase/tests/ are
      # manual SQL-editor checks, not pgTAP.
      - if: steps.scope.outputs.run == 'true'
        name: pgTAP tests
        run: supabase test db supabase/tests/database

      # Schema drift against production, from a schema-only dump the owner
      # takes and stores as the PROD_SCHEMA_DUMP secret (base64 of the dump,
      # xz- or gzip-compressed or plain; see the runbook). CI never connects to
      # production. Both schemas are loaded into this one Postgres and dumped
      # with the same pg_dump, so version noise cannot show up as drift.
      #
      # The logs of this public repository are public, and drift is by
      # definition production SQL nobody reviewed here (SQL-editor functions,
      # policies, a webhook trigger's arguments). So nothing from the dump's
      # contents reaches the log or the summary: only object identifiers
      # (type, schema, name), counts and sha256 digests. The owner reads the
      # full diff locally (runbook). Never on pull_request: a PR runs its own
      # copy of this workflow, so PR-head code never receives the secret here.
      # Report-only: drift marks the step, not the job.
      - if: steps.scope.outputs.run == 'true' && github.event_name != 'pull_request'
        name: Schema diff against production (when a dump is provided)
        continue-on-error: true
        env:
          PROD_SCHEMA_DUMP: ${{ secrets.PROD_SCHEMA_DUMP }}
        run: |
          if [ -z "$PROD_SCHEMA_DUMP" ]; then
            echo "::notice::No PROD_SCHEMA_DUMP secret: schema diff against production skipped."
            echo "Schema diff skipped: no PROD_SCHEMA_DUMP secret." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export LC_ALL=C
          work="$RUNNER_TEMP/schema-diff"
          mkdir -p "$work"
          printf '%s' "$PROD_SCHEMA_DUMP" | base64 -d > "$work/prod.bin"
          if xz -t "$work/prod.bin" 2>/dev/null; then xz -dc "$work/prod.bin" > "$work/prod.sql"
          elif gzip -t "$work/prod.bin" 2>/dev/null; then gzip -dc "$work/prod.bin" > "$work/prod.sql"
          else cp "$work/prod.bin" "$work/prod.sql"; fi

          q() { docker exec -i -e PGPASSWORD=postgres "$DB_CONTAINER" \
                  psql -h 127.0.0.1 -U postgres -X -q -v ON_ERROR_STOP=1 "$@"; }
          # A scratch database with just enough of Supabase for the dump to
          # load: the extensions it calls and stubs of auth.jwt()/auth.uid().
          q -d postgres -c 'drop database if exists prod_ref' -c 'create database prod_ref'
          q -d prod_ref \
            -c 'create schema if not exists extensions' \
            -c 'create extension if not exists "uuid-ossp" with schema extensions' \
            -c 'create extension if not exists pgcrypto with schema extensions' \
            -c 'create schema if not exists auth' \
            -c "create or replace function auth.jwt() returns jsonb language sql stable as 'select null::jsonb'" \
            -c "create or replace function auth.uid() returns uuid language sql stable as 'select null::uuid'" \
            -c 'drop schema public cascade'
          # psql quotes the failing statement on error, so its output stays
          # off the log; only the dump's line number is reported.
          if ! sed -e '/^\\restrict /d' -e '/^\\unrestrict /d' \
                   -e '/^ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin /d' "$work/prod.sql" \
               | q -d prod_ref -f - > "$work/prod-load.log" 2>&1; then
            at=$(grep -m1 -oE '^psql:[^:]*:[0-9]+: ERROR' "$work/prod-load.log" | sed -E 's/.*:([0-9]+): ERROR/\1/')
            echo "::error::The production dump did not load into the scratch database (dump line ${at:-unknown}). The message is withheld from this public log; load the dump locally to read it (docs/RUNBOOK-ci-database.md)."
            exit 1
          fi

          # One line per schema object: "<type> <schema>.<name>", a tab, then
          # its normalised SQL. Keyed on pg_dump's own "-- Name:" headers.
          objects() {
            docker exec -e PGPASSWORD=postgres "$DB_CONTAINER" \
              pg_dump -h 127.0.0.1 -U postgres -d "$1" --schema-only --no-owner \
                --schema=public --schema=entitlements \
            | awk '
                /^-- Name: / {
                  line = substr($0, 10)
                  i = index(line, "; Type: ");   name = substr(line, 1, i - 1);  rest = substr(line, i + 8)
                  i = index(rest, "; Schema: "); type = substr(rest, 1, i - 1);  rest = substr(rest, i + 10)
                  i = index(rest, "; Owner: ");  schema = (i ? substr(rest, 1, i - 1) : rest)
                  key = type " " schema "." name
                  next
                }
                /^--/ || /^$/ || /^\\(un)?restrict / { next }
                key != "" { body[key] = body[key] $0 "\037" }
                END { for (k in body) print k "\t" body[k] }
              ' | sort
          }
          objects prod_ref > "$work/prod.obj"
          objects postgres > "$work/repo.obj"
          cut -f1 "$work/prod.obj" > "$work/prod.keys"
          cut -f1 "$work/repo.obj" > "$work/repo.keys"
          comm -23 "$work/prod.keys" "$work/repo.keys" > "$work/only-prod"
          comm -13 "$work/prod.keys" "$work/repo.keys" > "$work/only-repo"
          comm -12 "$work/prod.keys" "$work/repo.keys" > "$work/both"
          comm -3 "$work/prod.obj" "$work/repo.obj" | sed 's/^\t//' | cut -f1 | sort -u \
            | comm -12 - "$work/both" > "$work/changed"
          rm -f "$work/prod.bin" "$work/prod.sql"

          n_prod=$(wc -l < "$work/only-prod"); n_repo=$(wc -l < "$work/only-repo"); n_changed=$(wc -l < "$work/changed")
          digests="sha256 of the normalised object lists: production $(sha256sum < "$work/prod.obj" | cut -c1-16), repository $(sha256sum < "$work/repo.obj" | cut -c1-16)"
          if [ "$n_prod" -eq 0 ] && [ "$n_repo" -eq 0 ] && [ "$n_changed" -eq 0 ]; then
            echo "Schema matches production: $(wc -l < "$work/both") objects in public + entitlements. $digests." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          report() {
            echo "### Schema drift against production"
            echo ""
            echo "Object identifiers only; the SQL stays off this public log. Read the full diff locally (docs/RUNBOOK-ci-database.md). $digests."
            for kind in only-prod:"Only in production" only-repo:"Only in the repository" changed:"Different definitions"; do
              f="${kind%%:*}"; title="${kind#*:}"
              [ -s "$work/$f" ] || continue
              echo ""
              echo "**$title** ($(wc -l < "$work/$f")):"
              echo '```'
              head -n 200 "$work/$f"
              echo '```'
            done
          }
          report | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::warning::The repository schema differs from the production dump: $n_prod object(s) only in production, $n_repo only in the repository, $n_changed with different definitions. Identifiers are in the job summary."
          exit 1
