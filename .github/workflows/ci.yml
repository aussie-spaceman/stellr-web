name: CI

# Every gate in this file was previously local and optional. The deploy record
# shows what that meant in practice: a production deployment made from a dirty
# working tree, and most changes reaching production without any of these
# having run. A check that only runs when someone remembers is not a check.

on:
  # Manual trigger, so the workflow can be exercised without waiting for an
  # event — and so it is reachable while it is still the only one in the repo.
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Placeholders. `next build` instantiates clients at module scope (see
      # lib/supabase.ts), so the build needs syntactically valid values — it
      # never connects to anything with them. Real values live in Vercel.
      NEXT_PUBLIC_APP_ENV: dev
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      NEXT_PUBLIC_SANITY_PROJECT_ID: placeholder
      # Public media host (non-secret; same value in every environment).
      NEXT_PUBLIC_MEDIA_BASE_URL: https://l3zabozgfpz3vahd.public.blob.vercel-storage.com
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SITE_URL: https://www.stellreducation.org
      NEXT_PUBLIC_AUTH_APP_URL: https://app.stellreducation.org
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      CLERK_SECRET_KEY: sk_test_placeholder

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the Vercel project's runtime (nodeVersion 24.x), which is
          # the thing this job exists to predict; .nvmrc and engines.node agree.
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Design-system lint
        run: npm run lint:tokens

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20

    # One e2e job at a time across the whole repo, not per ref. Every run, from
    # any branch, writes the same seeded rows on the one dev Supabase project,
    # and the workflow-level group above only serialises runs of the SAME ref.
    # On 24 Sept a PR run and a dev run overlapped; with the credentials spec
    # resetting Grace's credential in its hooks, one run could flip it private
    # halfway through the other's publish test (TRACKER 13.1).
    #
    # cancel-in-progress: false, so a running suite is never killed halfway
    # through, with rows left mutated. GitHub keeps only ONE pending job per
    # group: if a third run queues while one runs and one waits, the waiting
    # one is cancelled. Its e2e check then reads "cancelled"; re-run that job.
    concurrency:
      group: e2e-dev-supabase
      cancel-in-progress: false

    env:
      # Non-secret configuration. The dev Supabase project, never production —
      # e2e/global-setup.ts also refuses production hosts by name, but the URL
      # is pinned here so a mis-set secret cannot silently redirect the suite.
      NEXT_PUBLIC_APP_ENV: dev
      NEXT_PUBLIC_SUPABASE_URL: https://xvxlhbxtiwxpopoqjygm.supabase.co
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_AUTH_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /account
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /account/onboarding
      NEXT_PUBLIC_MEDIA_BASE_URL: https://l3zabozgfpz3vahd.public.blob.vercel-storage.com

      # Secrets. Configure at Settings → Secrets and variables → Actions.
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.DEV_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.DEV_CLERK_SECRET_KEY }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
      E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      # Until the secrets exist this job cannot do anything meaningful. It says
      # so and stops, rather than failing every PR — but it does NOT report a
      # misleading pass: the summary states plainly that nothing ran.
      - name: Check configuration
        id: config
        run: |
          missing=""
          for name in NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY \
                      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY \
                      E2E_MEMBER_PASSWORD E2E_TEACHER_PASSWORD E2E_ADMIN_PASSWORD; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### E2E did not run"
              echo ""
              echo "Missing repository secrets:"
              for m in $missing; do echo "- \`$m\`"; done
              echo ""
              echo "Add them at **Settings → Secrets and variables → Actions**."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.config.outputs.ready == 'true'
        run: npm ci

      # Cached by version: a browser download is ~90MB and does not change
      # between runs of the same Playwright release.
      - if: steps.config.outputs.ready == 'true'
        id: pw-version
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - if: steps.config.outputs.ready == 'true'
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.v }}

      - if: steps.config.outputs.ready == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Deps only when the browser was cached — the system libraries are not.
      - if: steps.config.outputs.ready == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Built and served here rather than tested against a Vercel preview.
      # Preview builds queue behind one another on this plan, and a suite that
      # waits on someone else's queue is a suite that gets skipped.
      - if: steps.config.outputs.ready == 'true'
        run: npm run build

      - if: steps.config.outputs.ready == 'true'
        run: npx playwright test
        env:
          CI: 'true'

      - if: always() && steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
